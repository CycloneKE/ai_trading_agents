name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Allow manual runs for integration tests
  workflow_dispatch:
  # Weekly run against main with nothing changed.
  #
  # requirements-runtime.txt and requirements-ci.txt use version ranges, not
  # pins, so the libraries a build installs drift over time. A green history
  # plus a red scheduled run localises that immediately: the code did not
  # change, so something underneath it did. Without this the first sign is a
  # redeploy failing months later with no obvious cause.
  #
  # 05:00 UTC Monday, which is 08:00 in Nairobi.
  schedule:
    - cron: '0 5 * * 1'

jobs:
  preflight:
    # An `if:` expression cannot read the `secrets` context. Seven conditions
    # in this workflow did, which made the whole file fail to compile: every
    # run since July ended instantly as a startup failure with zero jobs.
    # Resolve secret presence once here and gate on these booleans instead.
    runs-on: ubuntu-latest
    outputs:
      has_dockerhub: ${{ steps.probe.outputs.has_dockerhub }}
      has_gcp: ${{ steps.probe.outputs.has_gcp }}
      has_market_data: ${{ steps.probe.outputs.has_market_data }}
    steps:
    - id: probe
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        GCP_WIP: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        FMP: ${{ secrets.TRADING_FMP_API_KEY }}
        FINNHUB: ${{ secrets.TRADING_FINNHUB_API_KEY }}
        COINBASE: ${{ secrets.COINBASE_API_KEY }}
      run: |
        both() { if [ -n "$1" ] && [ -n "$2" ]; then echo true; else echo false; fi; }
        all3() { if [ -n "$1" ] && [ -n "$2" ] && [ -n "$3" ]; then echo true; else echo false; fi; }
        {
          echo "has_dockerhub=$(both "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN")"
          echo "has_gcp=$(all3 "$GCP_WIP" "$GCP_SA" "$DOCKERHUB_USERNAME")"
          echo "has_market_data=$(all3 "$FMP" "$FINNHUB" "$COINBASE")"
        } >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Quoted deliberately: unquoted `3.10` is the YAML float 3.1.
        # 3.11 exercises the vendored indicator fallback, 3.12 the real
        # pandas_ta, so both code paths are covered on every run.
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements-ci.txt
        
    - name: Lint with pylint
      run: |
        pylint --disable=C0111,C0103,C0303,C0330,C0326 --max-line-length=120 \
               --fail-under=8.0 *.py
        
    - name: Check formatting with black (advisory)
      # Non-blocking: 262 files predate any formatting standard here. Clear
      # them in one dedicated `black --line-length 100 .` commit, then drop
      # this line to make formatting a hard gate.
      continue-on-error: true
      run: |
        black --check --line-length 100 .
        
    - name: Test with pytest
      env:
        # Test-only value. The auth module fails closed without it by design.
        SECRET_KEY: ci-secret-key-for-tests-only-not-a-real-key
      run: |
        # Run only unit tests in CI; integration tests (network/live) are marked with @pytest.mark.integration
        pytest -m "not integration" --maxfail=1 -q --durations=10 --cov=. --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  backtest_sanity:
    needs: test
    # Lightweight deterministic backtest sanity check to catch optimizer/backtest regressions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install minimal backtest deps
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements-ci.txt

    - name: Run backtest sanity test
      run: |
        # Run only the deterministic PoC backtest test
        pytest tests/test_poc_backtest_integration.py -q

  smoke_startup:
    needs: test
    # Run smoke startup on pushes to main (lightweight fallback-only smoke test)
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' }}
    # Lightweight smoke startup test that ensures the agent can initialize and serve /health
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install minimal deps for smoke test
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements-ci.txt

    - name: Run smoke startup test (fallback-only)
      env:
        SECRET_KEY: ci-secret-key-for-tests-only-not-a-real-key
      run: |
        # The smoke test sets data_manager.use_fallback_only in its temporary config
        pytest tests/test_agent_smoke.py -q

  build:
    needs: [test, preflight]
    # Also runs on pull requests. The images used to be built only after merge
    # to main, so a Dockerfile change reached a deployed server before anything
    # had proved it builds. Pushing to a registry stays restricted to `push`
    # events, so a pull request never authenticates to or publishes anything.
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) || github.event_name == 'pull_request' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Conditionally login to DockerHub (if secrets present)
      if: ${{ needs.preflight.outputs.has_dockerhub == 'true' && github.event_name == 'push' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build backend image (local, no push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: |
          ai-trading-agent:latest
          ai-trading-agent:${{ github.sha }}

    # Built separately because it has its own base image. The dashboard used
    # to be compiled into the Python image, which has no Node runtime, so it
    # could never actually start.
    - name: Build dashboard image (local, no push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.frontend
        push: false
        tags: |
          ai-trading-dashboard:latest
          ai-trading-dashboard:${{ github.sha }}

    - name: Push image to DockerHub (only if credentials present)
      if: ${{ needs.preflight.outputs.has_dockerhub == 'true' && github.event_name == 'push' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push built image to DockerHub
      if: ${{ needs.preflight.outputs.has_dockerhub == 'true' && github.event_name == 'push' }}
      run: |
        docker tag ai-trading-agent:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/ai-trading-agent:${{ github.sha }}
        docker tag ai-trading-agent:latest ${{ secrets.DOCKERHUB_USERNAME }}/ai-trading-agent:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ai-trading-agent:${{ github.sha }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ai-trading-agent:latest

  deploy:
    needs: [build, preflight]
    # Deploy only on pushes to main. The deploy step will check for required secrets before attempting to authenticate.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    
    # Add permissions for authenticating to GCP
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Authenticate to Google Cloud (requires GCP secrets)
      id: auth
      if: needs.preflight.outputs.has_gcp == 'true'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}


  integration:
    needs: [test, preflight]
    # Run integration tests only when integration secrets are configured OR when manually dispatched
    if: ${{ github.event_name == 'workflow_dispatch' || needs.preflight.outputs.has_market_data == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python for integration
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install test dependencies (integration)
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements-ci.txt
        # If you need full runtime deps in integration, uncomment the next line in repo and ensure requirements-runtime.txt exists
        # pip install -r requirements-runtime.txt

    - name: Run integration tests
      env:
        SECRET_KEY: ci-secret-key-for-tests-only-not-a-real-key
      run: |
        # No test carries the `integration` marker yet. pytest exits 5 on an
        # empty collection, which would fail this job on every manual run for
        # no reason; treat "nothing collected" as a pass and let any real
        # failure through.
        rc=0
        pytest -m integration -q --maxfail=1 || rc=$?
        if [ "$rc" -eq 5 ]; then
          echo "No tests are marked 'integration'; nothing to run."
          exit 0
        fi
        exit "$rc"

    - name: Deploy to Cloud Run (requires GCP + DockerHub secrets)
      id: deploy
      if: needs.preflight.outputs.has_gcp == 'true'
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        service: 'ai-trading-agent'
        region: 'us-central1'
        image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ai-trading-agent:${{ github.sha }}

  docker_image_build:
    needs: [test, preflight]
    runs-on: ubuntu-latest
    # Manual runs are allowed via workflow_dispatch. Push step will require DockerHub secrets.
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub (optional)
      if: needs.preflight.outputs.has_dockerhub == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image (production target)
      run: |
        docker buildx build --platform linux/amd64 --tag ai-trading-agent:ci --load .

    - name: Show image size
      run: |
        docker images ai-trading-agent:ci --format "{{.Repository}}:{{.Tag}} {{.Size}}"
