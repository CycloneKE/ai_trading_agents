version: "3.8"

services:
  backend:
    build: .
    container_name: ai-trading-backend-local
    env_file: .env
    ports:
      - "8080:8080"
      - "8081:8081"
    command: ["python3", "main.py"]
    depends_on:
      - postgres
      - redis
    networks:
      - ai_trading_net
    restart: unless-stopped

  frontend:
    build: .
    container_name: ai-trading-frontend-local
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3001:3001"
    command: ["npx", "next", "start", "-p", "3001", "-H", "0.0.0.0"]
    networks:
      - ai_trading_net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres-local
    environment:
      POSTGRES_DB: ${DB_NAME:-trading_agent}
      POSTGRES_USER: ${DB_USER:-trading_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_trading_net

  redis:
    image: redis:7-alpine
    container_name: trading-redis-local
    command: ["redis-server","--requirepass","${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_trading_net

volumes:
  postgres_data: {}
  redis_data: {}

networks:
  ai_trading_net: {}
