version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ai_trading_agents:backend-dev
    container_name: ai-trading-backend-dev
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - postgres
      - redis
    networks:
      - ai_trading_net

  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME:-trading_agent}
      POSTGRES_USER: ${DB_USER:-trading_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_trading_net

  redis:
    image: redis:7-alpine
    container_name: trading-redis-dev
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_trading_net

volumes:
  postgres_data:
  redis_data:

networks:
  ai_trading_net:
    driver: bridge
