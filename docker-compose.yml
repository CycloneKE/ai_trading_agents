version: "3.8"

services:
  backend:
    build: .
    image: ai_trading_agents:backend
    container_name: ai-trading-backend
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "8080:8080" # monitoring
      - "5001:5001" # api (config.json api.port)
    command: ["python3", "-m", "src.agent.main"]
    depends_on:
      - redis
    networks:
      - ai_trading_net
    restart: unless-stopped

  frontend:
    build: .
    image: ai_trading_agents:frontend
    container_name: ai-trading-frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3001:3001"
    # Start only the Next.js frontend process
    command: ["npx", "next", "start", "-p", "3001", "-H", "0.0.0.0"]
    networks:
      - ai_trading_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-@Sylvester214}
    volumes:
      - redis_data:/data
    networks:
      - ai_trading_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: {}

networks:
  ai_trading_net:
    driver: bridge
