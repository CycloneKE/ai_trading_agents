# Local and plain-VPS deployment. For Coolify use docker-compose.coolify.yml.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai_trading_agents:backend
    container_name: ai-trading-backend
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      # Dashboard origin(s) the API accepts; must match how traders reach it.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    volumes:
      # The order and decision journals are the run's only durable record.
      # Without this mount they live in the container's writable layer and are
      # destroyed by every redeploy, rebuild or `docker compose down`, which on
      # a ninety-day run means losing the evidence the run exists to produce.
      # A NAMED volume, not a bind mount: it inherits the image's ownership, so
      # the non-root `trader` user (uid 10001) can write to it.
      - trading_data:/app/data
      - trading_logs:/app/logs
    # Ports bound to loopback only: expose the app through the Caddy TLS
    # proxy (deploy/Caddyfile), never plaintext HTTP on a public interface.
    ports:
      - "127.0.0.1:8080:8080" # monitoring / health
      - "127.0.0.1:5001:5001" # api (config.json api.port)
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai_trading_net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ai_trading_agents:frontend
    container_name: ai-trading-frontend
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - ai_trading_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    networks:
      - ai_trading_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  trading_data: {}
  trading_logs: {}
  redis_data: {}

networks:
  ai_trading_net:
    driver: bridge
