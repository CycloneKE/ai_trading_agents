version: "3.8"

services:
  backend:
    build: .
    image: ai_trading_agents:backend
    container_name: ai-trading-backend
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "8080:8080" # monitoring
      - "8081:8081" # api (configured via config.json)
    command: ["python3", "main.py"]
    depends_on:
      - postgres
      - redis
    networks:
      - ai_trading_net
    restart: unless-stopped

  frontend:
    build: .
    image: ai_trading_agents:frontend
    container_name: ai-trading-frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3001:3001"
    # Start only the Next.js frontend process
    command: ["npx", "next", "start", "-p", "3001", "-H", "0.0.0.0"]
    networks:
      - ai_trading_net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-trading_agent}
      POSTGRES_USER: ${DB_USER:-trading_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Ports NOT exposed to host — only accessible within Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_trading_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trading_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # Ports NOT exposed to host — only accessible within Docker network
    volumes:
      - redis_data:/data
    networks:
      - ai_trading_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: {}
  redis_data: {}

networks:
  ai_trading_net:
    driver: bridge
