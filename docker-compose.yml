version: "3.8"

services:
  backend:
    build: .
    image: ai_trading_agents:backend
    container_name: ai-trading-backend
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      # Dashboard origin(s) the API accepts; must match how traders reach it.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    # Ports bound to loopback only: expose the app through the Caddy TLS
    # proxy (deploy/Caddyfile), never plaintext HTTP on a public interface.
    ports:
      - "127.0.0.1:8080:8080" # monitoring
      - "127.0.0.1:5001:5001" # api (config.json api.port)
    command: ["python3", "-m", "src.agent.main"]
    depends_on:
      - redis
    networks:
      - ai_trading_net
    restart: unless-stopped

  frontend:
    build: .
    image: ai_trading_agents:frontend
    container_name: ai-trading-frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3001"
    # Start only the Next.js frontend process
    command: ["npx", "next", "start", "-p", "3001", "-H", "0.0.0.0"]
    networks:
      - ai_trading_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    networks:
      - ai_trading_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: {}

networks:
  ai_trading_net:
    driver: bridge
